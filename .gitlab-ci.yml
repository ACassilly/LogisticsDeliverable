# Riven SCM CI/CD — Portlandia Logistics Storefront & Freight Platform
# Canonical Repo: scm.rivenai.io/portlandia-logistics/storefront (#128)
# Deploys blue-green standalone container on riven-origin-1 (:3013 / :3014)

stages:
  - build
  - deploy
  - verify

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_API_VERSION: "1.44"
  IMAGE: $CI_REGISTRY_IMAGE

build-storefront:
  stage: build
  tags: [deploy]
  image: docker:24
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_IID'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\//'
    - if: '$CI_COMMIT_BRANCH =~ /^fix\//'
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - if docker image inspect "$IMAGE:latest" >/dev/null 2>&1; then docker tag "$IMAGE:latest" "$IMAGE:prev"; fi
    - docker build --build-arg NEXT_PUBLIC_APP_URL=https://portlandialogistics.com --build-arg NEXT_PUBLIC_CARRIER_BOOKING_ENABLED=false -f Dockerfile -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"

deploy-blue-green:
  stage: deploy
  tags: [deploy]
  image: docker:24
  needs: [build-storefront]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - set -e
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - SVC="portlandia-logistics-web"
    - CUR_PORT=$(docker inspect "$SVC" --format '{{json .HostConfig.PortBindings}}' 2>/dev/null | grep -o '"HostPort":"[0-9]*"' | grep -o '[0-9]*' | head -1 || true)
    - if [ "$CUR_PORT" = "3013" ]; then GREEN_PORT=3014; else GREEN_PORT=3013; fi
    - GREEN="${SVC}-green-${CI_COMMIT_SHORT_SHA}"
    - echo "Deploying $SVC green container $GREEN on host port :$GREEN_PORT (current blue :${CUR_PORT:-none})"
    - docker ps -aq --filter "name=${SVC}-green-" | xargs -r docker rm -f || true
    - docker ps -aq --filter "publish=$GREEN_PORT" | xargs -r docker rm -f || true
    - |
      docker run -d --name "$GREEN" --restart unless-stopped \
        --network riven-edge-net \
        -p "127.0.0.1:${GREEN_PORT}:3000" \
        -e NODE_ENV=production \
        -e PORT=3000 \
        -e HOSTNAME=0.0.0.0 \
        -e NEXT_PUBLIC_APP_URL=https://portlandialogistics.com \
        -e RIVEN_TENANT=portlandia-logistics \
        -e RIVEN_COMMIT=$CI_COMMIT_SHORT_SHA \
        -e ODOO_URL=https://axis.portlandialogistics.com \
        -e ODOO_DB=riven_erp_logistics \
        "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker network connect riven-auth-net "$GREEN" || true
    - |
      for i in $(seq 1 30); do
        if docker exec "$GREEN" wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q '"success":true'; then
          echo "Green container $GREEN passed /api/health on attempt $i"
          break
        fi
        if [ "$i" -eq 30 ]; then
          docker logs "$GREEN" || true
          docker rm -f "$GREEN" || true
          exit 1
        fi
        sleep 1
      done
    - docker network disconnect riven-edge-net "$GREEN"
    - docker network connect --alias "$SVC" riven-edge-net "$GREEN"
    # Ensure steady port :3013 is also served via socat/alias or direct port swap:
    - |
      if docker ps -a --format '{{.Names}}' | grep -qx "$SVC"; then
        OLD="${SVC}-old-${CI_PIPELINE_ID}"
        docker rename "$SVC" "$OLD"
        docker rename "$GREEN" "$SVC"
        docker stop "$OLD" || true
        docker rm "$OLD" || true
      else
        docker rename "$GREEN" "$SVC"
      fi
    # If green landed on 3014, bounce into canonical 127.0.0.1:3013 so Cloudflare tunnel (127.0.0.1:3013) always hits live:
    - |
      if [ "$GREEN_PORT" = "3014" ]; then
        docker rm -f "${SVC}-3013" 2>/dev/null || true
        docker rename "$SVC" "${SVC}-swap"
        docker run -d --name "$SVC" --restart unless-stopped \
          --network riven-edge-net --network-alias "$SVC" \
          -p "127.0.0.1:3013:3000" \
          -e NODE_ENV=production \
          -e PORT=3000 \
          -e HOSTNAME=0.0.0.0 \
          -e NEXT_PUBLIC_APP_URL=https://portlandialogistics.com \
          -e RIVEN_TENANT=portlandia-logistics \
          -e RIVEN_COMMIT=$CI_COMMIT_SHORT_SHA \
          -e ODOO_URL=https://axis.portlandialogistics.com \
          -e ODOO_DB=riven_erp_logistics \
          "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker network connect riven-auth-net "$SVC" || true
        sleep 3
        docker stop "${SVC}-swap" && docker rm "${SVC}-swap"
      fi

verify-storefront:
  stage: verify
  tags: [deploy]
  image: docker:24
  needs: [deploy-blue-green]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - docker exec portlandia-logistics-web wget -qO- http://127.0.0.1:3000/api/health | grep -q '"success":true'
    - docker exec portlandia-logistics-web wget -qO- http://127.0.0.1:3000/ | grep -q 'Ship Smarter'
    - echo "REAL-PROOF: portlandia-logistics-web healthy on origin-1 :3013"
